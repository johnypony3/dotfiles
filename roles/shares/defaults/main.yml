---
nas_user: "edward"
nas_home: "/Users/{{ nas_user }}"
smb_server: "192.168.9.7"
smb_user: "edward"
smb_shares:
  - { share: "share", mount_point: "nas/share" }
  - { share: "edward", mount_point: "nas/edward" }
mount_script: "{{ nas_home }}/.local/bin/mount-nas.sh"
launchagent_label: "com.theemm.nasmount"
launchagent_plist: "{{ nas_home }}/Library/LaunchAgents/{{ launchagent_label }}.plist"
remount_interval: 120
