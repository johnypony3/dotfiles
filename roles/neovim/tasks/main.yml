---
- name: Install Neovim
  community.general.homebrew:
    name: neovim
    state: present

- name: Create Neovim config directory
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/nvim"
    state: directory
    mode: "0755"

- name: Deploy Neovim config
  ansible.builtin.copy:
    src: nvim/
    dest: "{{ ansible_user_dir }}/.config/nvim/"
    mode: "0644"
    directory_mode: "0755"
