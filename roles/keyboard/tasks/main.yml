---
- name: Deploy Caps Lock → Ctrl LaunchAgent plist
  ansible.builtin.copy:
    src: com.local.hidutil.keyboard.plist
    dest: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.local.hidutil.keyboard.plist"
    mode: "0644"
    backup: true

- name: Load LaunchAgent
  ansible.builtin.command:
    cmd: launchctl load -w "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/com.local.hidutil.keyboard.plist"
  changed_when: false

- name: Apply Caps Lock → Ctrl remap immediately
  ansible.builtin.command:
    cmd: >
      /usr/bin/hidutil property --set
      '{"UserKeyMapping":[{"HIDKeyboardModifierMappingSrc":30064771129,"HIDKeyboardModifierMappingDst":30064771296}]}'
  changed_when: false
