# --- sensible defaults ---

set -g history-limit 10000
set -g escape-time 10
set -g mouse on
set -g base-index 0
set -g pane-base-index 0
set -g renumber-windows on

# --- true color ---

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",tmux-256color:RGB"

# --- activity alerts ---

set -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style "fg=colour220,bold"

# --- keybindings ---

set -g prefix2 C-a
bind C-a send-prefix -2

bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.tmux.conf \; display "Config reloaded"

# popup scratch terminal
bind t display-popup -E -w 80% -h 80% "tmux new-session -A -s scratch"

# cheat sheet
bind / display-popup -w 66 -h 30 "cat ~/.tmux/cheatsheet.txt"

# zoom panes 1+2 within their combined width only, everywhere else zoom is normal
bind z run-shell -b '~/.tmux/zoom12.sh'

# --- vi copy mode + clipboard ---

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- status bar ---

set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50

set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[fg=colour39,bold]#H #[fg=colour250]| "
set -g status-right "#[fg=colour250]%Y-%m-%d %H:%M"

set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=colour39,bold] #I:#W "

set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"

# --- plugins ---

set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

set -g @yank_selection_mouse 'clipboard'

run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
run-shell ~/.tmux/plugins/tmux-yank/yank.tmux
