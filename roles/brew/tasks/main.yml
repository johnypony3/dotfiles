---
- name: Install Homebrew
  ansible.builtin.shell:
    cmd: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    creates: /opt/homebrew/bin/brew

- name: Deploy Brewfile
  ansible.builtin.copy:
    src: Brewfile
    dest: "{{ ansible_user_dir }}/Brewfile"
    mode: "0644"

- name: Install packages from Brewfile
  ansible.builtin.command:
    cmd: brew bundle install --file={{ ansible_user_dir }}/Brewfile --no-lock
  register: brew_bundle
  changed_when: "'Installing' in brew_bundle.stdout or 'Downloading' in brew_bundle.stdout"
